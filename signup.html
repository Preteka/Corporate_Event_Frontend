<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="icon" type="image/png" href="assets/logo/venora-favicon.png" sizes="120x119">

  <title>Create Account | VENORA Events &amp; Venues</title>
  <meta name="description" content="Register your VENORA account to organize corporate event enquiries, coordinate venue details, and track planning milestones.">

  <!-- Open Graph / Meta -->
  <meta property="og:title" content="Create Account | VENORA Events &amp; Venues">
  <meta property="og:description" content="Register your account to organize corporate event enquiries and booking details.">
  <meta property="og:type" content="website">

  <!-- Google Fonts: Sora (Headings) & DM Sans (Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=Sora:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- Core & Auth Stylesheets (Standalone - No Navbar or Footer CSS) -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">

  <!-- Theme Script: Runs immediately to prevent flash of unstyled theme -->
  <script src="js/theme.js"></script>
</head>

<body>
  <!-- Accessible Skip Navigation Link -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Minimal Floating Appearance & Direction Controls -->
  <aside class="auth-floating-controls" aria-label="Display Controls">
    <button type="button" class="auth-control-btn theme-toggle-btn" data-action="toggle-theme" role="switch" aria-checked="false" aria-label="Toggle Theme" title="Toggle Theme">
      <span class="icon-theme icon-sun" aria-hidden="true">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </span>
      <span class="icon-theme icon-moon" aria-hidden="true">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </span>
    </button>
    <button type="button" class="auth-control-btn dir-toggle-btn" data-action="toggle-dir" role="switch" aria-checked="false" aria-label="Toggle Direction" title="Toggle Direction">
      <span class="dir-indicator" aria-hidden="true">LTR</span>
    </button>
  </aside>

  <!-- Main Landmark -->
  <main id="main-content">
    <section class="auth-page-section" aria-label="Account Registration Portal">
      <div class="auth-bg-glow" aria-hidden="true"></div>

      <div class="auth-card-container">
        <div class="auth-card">
          <div class="auth-card-header">
            <a href="index.html" class="auth-brand-logo" aria-label="VENORA Home">
              <img src="assets/logo/logo.png" alt="VENORA Events &amp; Venues" class="brand-logo" width="160" height="54">
            </a>
            <h1 class="auth-title">Create Account</h1>
            <p class="auth-subtitle">Organize your event enquiries and booking details.</p>
          </div>

          <!-- Alert Notification Box -->
          <div id="auth-alert" class="auth-alert-banner" role="alert" hidden></div>

          <!-- Sign Up Form -->
          <form id="signup-form" class="auth-form" novalidate>
            <div class="form-group">
              <label for="signup-name" class="form-label">Full Name</label>
              <div class="form-input-wrap">
                <input type="text" id="signup-name" name="fullname" class="form-input" placeholder="Eleanor Vance" required autocomplete="name">
              </div>
            </div>

            <div class="form-group">
              <label for="signup-email" class="form-label">Corporate Email</label>
              <div class="form-input-wrap">
                <input type="email" id="signup-email" name="email" class="form-input" placeholder="e.vance@enterprise.com" required autocomplete="email">
              </div>
            </div>

            <div class="form-group">
              <label for="signup-phone" class="form-label">Phone Number (Optional)</label>
              <div class="form-input-wrap">
                <input type="tel" id="signup-phone" name="phone" class="form-input" placeholder="+91 98765 43210" autocomplete="tel">
              </div>
            </div>

            <div class="form-group">
              <label for="signup-password" class="form-label">Password</label>
              <div class="form-input-wrap has-toggle">
                <input type="password" id="signup-password" name="password" class="form-input" placeholder="At least 6 characters" required autocomplete="new-password">
                <button type="button" class="password-toggle-btn" data-toggle="password" data-target="signup-password" aria-label="Show password">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
              </div>
            </div>

            <div class="form-group">
              <label for="signup-confirm-password" class="form-label">Confirm Password</label>
              <div class="form-input-wrap has-toggle">
                <input type="password" id="signup-confirm-password" name="confirm_password" class="form-input" placeholder="Confirm password" required autocomplete="new-password">
                <button type="button" class="password-toggle-btn" data-toggle="password" data-target="signup-confirm-password" aria-label="Show password">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
              </div>
            </div>

            <div class="form-row-utility">
              <label class="checkbox-label">
                <input type="checkbox" name="terms" class="form-checkbox" required checked>
                <span>I agree to VENORA terms &amp; privacy policies</span>
              </label>
            </div>

            <button type="submit" class="btn btn-primary auth-submit-btn" id="signup-submit-btn">
              <span>Create VENORA Account</span>
            </button>

            <!-- Subtle Divider -->
            <div class="auth-divider" role="separator" aria-label="Or continue with social provider">
              <span class="auth-divider-line"></span>
              <span class="auth-divider-text">OR CONTINUE WITH</span>
              <span class="auth-divider-line"></span>
            </div>

            <!-- Social Sign-In Buttons -->
            <div class="auth-social-group">
              <button type="button" class="auth-social-btn" data-social-provider="Google" aria-label="Continue with Google">
                <svg class="social-icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                  <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                  <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                  <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                  <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>Continue with Google</span>
              </button>

              <button type="button" class="auth-social-btn" data-social-provider="Apple" aria-label="Continue with Apple">
                <svg class="social-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.63-.77 1.06-1.84.94-2.91-.91.04-2.02.61-2.67 1.38-.58.68-1.09 1.77-.95 2.82 1.02.08 2.05-.52 2.68-1.29z"/>
                </svg>
                <span>Continue with Apple</span>
              </button>

              <button type="button" class="auth-social-btn" data-social-provider="LinkedIn" aria-label="Continue with LinkedIn">
                <svg class="social-icon" width="18" height="18" viewBox="0 0 24 24" fill="#0A66C2" aria-hidden="true">
                  <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/>
                </svg>
                <span>Continue with LinkedIn</span>
              </button>
            </div>
          </form>

          <div class="auth-card-footer">
            <span>Already have an account?</span>
            <a href="login.html" id="link-to-login">Sign In</a>
          </div>

          <!-- Demo Access Section -->
          <div class="auth-demo-section" aria-label="Demo Access">
            <div class="auth-divider auth-demo-divider" role="separator">
              <span class="auth-divider-line"></span>
              <span class="auth-divider-text">DEMO ACCESS</span>
              <span class="auth-divider-line"></span>
            </div>
            <p class="auth-demo-desc">Instant evaluation access without corporate credentials:</p>
            <div class="auth-demo-buttons">
              <button type="button" class="auth-demo-btn btn-demo-admin" id="btn-demo-admin" aria-label="Open Admin Dashboard">
                <span class="demo-btn-icon" aria-hidden="true">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z"></path>
                  </svg>
                </span>
                <span>Open Admin Dashboard</span>
              </button>
              <button type="button" class="auth-demo-btn btn-demo-user" id="btn-demo-user" aria-label="Open User Dashboard">
                <span class="demo-btn-icon" aria-hidden="true">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                  </svg>
                </span>
                <span>Open User Dashboard</span>
              </button>
            </div>
          </div>
        </div>

        <div style="text-align: center;">
          <a href="index.html" class="auth-back-link">
            <span aria-hidden="true">&larr;</span>
            <span>Return to VENORA Home</span>
          </a>
        </div>
      </div>
    </section>
  </main>

  <!-- Auth Script -->
  <script src="js/auth.js"></script>
</body>

</html>
